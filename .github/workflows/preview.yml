name: Preview

# PR の状態を、本番トラフィックに出さずにブラウザで確認できるようにする。
# `wrangler versions upload` は「バージョンをアップロードするが deploy はしない」ので、
# 本番の配信は現行バージョンのまま変わらない。
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # fork からの PR には secrets が渡らず必ず失敗するため、同一リポジトリの PR に限定する。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # --env production を使うのは、APP_BASE_URL が本番値でないと
      # セッション Cookie 名（__Host- プレフィックスの有無）が本番とずれて
      # 認証の挙動が変わり、プレビューの意味が薄れるため。
      - name: Upload API version
        id: api
        run: |
          set -o pipefail
          pnpm --filter @stacx/api exec wrangler versions upload \
            --env production \
            --message "PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}" \
            2>&1 | tee api-upload.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' api-upload.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build Web
        run: pnpm --filter @stacx/web run build

      - name: Upload Web version
        id: web
        run: |
          set -o pipefail
          pnpm --filter @stacx/web exec wrangler versions upload \
            --message "PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}" \
            2>&1 | tee web-upload.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' web-upload.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 同じ PR に push するたびにコメントが増えないよう、既存コメントがあれば編集する。
      # プレビュー URL はブランチ単位で不変なので、1 コメントを更新し続ければ十分。
      - name: Comment preview URLs
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_URL: ${{ steps.web.outputs.url }}
          API_URL: ${{ steps.api.outputs.url }}
          PR: ${{ github.event.number }}
        run: |
          body=$(cat <<EOF
          <!-- stacx-preview -->
          ### 🔍 プレビュー（本番未反映）

          | worker | URL |
          |---|---|
          | web (stacx) | ${WEB_URL:-取得できず} |
          | api (stacx-api) | ${API_URL:-取得できず} |

          \`wrangler versions upload\` でアップロードしたバージョンで、**本番の配信は現行バージョンのまま**。

          > **注意: このプレビューは本番 D1 に接続している。**
          > バージョンが保持するのはコード・設定・バインディングまでで、D1 の中身はバージョン管理されない。
          > 破壊的な書き込みを含む変更をこの URL で試すと、本番データに影響する。
          >
          > また web の service binding は worker 名 \`stacx-api\` を参照するため、
          > **web のプレビューが呼ぶ api は「本番にデプロイ済みのバージョン」**であり、上の api プレビューではない。
          > api の変更を確かめたい場合は api 側のプレビュー URL を直接叩くこと。
          EOF
          )
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                 --jq '.[] | select(.body | contains("<!-- stacx-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body" >/dev/null
          fi
