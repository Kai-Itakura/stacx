name: Deploy

# CI（Biome / typecheck / test）が main または stg で成功したときに発火する。
# - stg ブランチ → staging のみデプロイ
# - main ブランチ → production のみデプロイ
# 2 つのジョブは独立しており、staging の成否が production をブロックしない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, stg]

# デプロイは途中で止めない。api だけ出て web が出ていない状態や、
# マイグレーションだけ当たってデプロイが中断した状態を避ける。
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # stg ブランチの CI が成功したときだけ staging へデプロイする。
  staging:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'stg'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 適用前に未適用の一覧をログへ残す。何が当たったかを後から追えるようにするため。
      - name: List pending migrations (staging)
        continue-on-error: true
        run: pnpm --filter @stacx/api exec wrangler d1 migrations list stacx-db-staging --remote --env staging

      # マイグレーションはデプロイより先。新しいカラムを読むコードを先に出すと、
      # 適用までの間だけ壊れた状態が生まれる。
      - name: Apply D1 migrations (staging)
        run: pnpm --filter @stacx/api exec wrangler d1 migrations apply stacx-db-staging --remote --env staging

      # api → web の順で直列デプロイ（root の deploy:staging スクリプトが && で保証）。
      - name: Deploy API → Web (staging)
        run: pnpm run deploy:staging

      - name: Summary
        run: |
          {
            echo "### Staging デプロイ完了"
            echo ""
            echo "- commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- staging: https://stacx-staging.itakai199969-e42.workers.dev"
            echo ""
            echo "D1 マイグレーションを適用済み。"
          } >> "$GITHUB_STEP_SUMMARY"

  # main ブランチの CI が成功したときだけ production へデプロイする。
  # staging とは独立しており、stg ブランチの状態に関係なく実行される。
  production:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # GitHub の Settings → Environments で production に承認者を設定すれば、
    # ワークフローを変更せずここを手動承認ゲートにできる。
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: List pending migrations (production)
        continue-on-error: true
        run: pnpm --filter @stacx/api exec wrangler d1 migrations list stacx-db --remote --env production

      # staging で同じ SQL が通っていることを前提とする。ここで初めて本番 D1 に触れる。
      - name: Apply D1 migrations (production)
        run: pnpm --filter @stacx/api exec wrangler d1 migrations apply stacx-db --remote --env production

      # api → web の順で直列デプロイ（root の deploy:production スクリプトが && で保証）。
      - name: Deploy API → Web (production)
        run: pnpm run deploy:production

      - name: Summary
        run: |
          {
            echo "### Production デプロイ完了"
            echo ""
            echo "- commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- production: https://stacx.itakai199969-e42.workers.dev"
            echo ""
            echo "D1 マイグレーションを適用済み。"
          } >> "$GITHUB_STEP_SUMMARY"
